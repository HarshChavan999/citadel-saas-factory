# Model Routing Configuration
# Maps agent tiers to model providers with fallback chains

tiers:
  reasoning_deep:
    description: Complex architecture, strategy, security analysis
    primary: gemini-3.6-flash
    fallbacks:
      - gemini-3.5-flash
      - gemini-3.5-flash-lite
    max_tokens: 8192
    temperature: 0.3

  reasoning_fast:
    description: Main development, code generation, reviews
    primary: gemini-3.6-flash
    fallbacks:
      - gemini-3.5-flash
      - gemini-3.5-flash-lite
    max_tokens: 4096
    temperature: 0.2

  cheap_fast:
    description: Content generation, simple tasks, high volume
    primary: gemini-3.5-flash-lite
    fallbacks:
      - gemini-3.1-flash-lite
      - gemini-3.5-flash
    max_tokens: 2048
    temperature: 0.4

  rag_specialist:
    description: RAG generation with citation grounding
    primary: gemini-3.6-flash
    fallbacks:
      - gemini-3.5-flash
      - gemini-3.5-flash-lite
    max_tokens: 4096
    temperature: 0.1

  local_only:
    description: Budget-exceeded fallback, local models only
    primary: ollama/llama3.1
    fallbacks:
      - ollama/mistral
    max_tokens: 2048
    temperature: 0.3



cost_controls:
  daily_budget_usd: 50.0
  warn_at_pct: 80
